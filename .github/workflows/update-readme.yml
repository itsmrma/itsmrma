name: Update Profile README

on:
  schedule:
    # Run automatically every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI
  repository_dispatch:
    # Allows triggers from other repos (e.g. SyncForge release workflow)
    types: [repo-updated, stack-updated]

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run README update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected in README.md."
          else
            git commit -m "chore(readme): auto-update tech stack & repo metadata"
            git push
          fi
